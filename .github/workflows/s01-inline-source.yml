name: Update s01 inline sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/s01-inline-source.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')
          css='''\n/* s01: results + sources in one horizontal line */\n#nw #s01 .fan-tabs{display:none!important}\n#nw #s01 .fan-caption{display:none!important}\n#nw #s01 .fan-deck{height:auto!important;max-width:none!important;margin:34px 0 0!important;display:flex!important;align-items:center!important;gap:10px!important;overflow-x:auto!important;padding:4px 0 18px!important}\n#nw #s01 .fan-deck .card{position:relative!important;inset:auto!important;left:auto!important;top:auto!important;margin:0!important;flex:0 0 auto!important;width:auto!important;height:300px!important;transform:none!important;box-shadow:none!important;outline:0!important}\n#nw #s01 .fan-deck .card img{width:auto!important;height:100%!important;object-fit:contain!important}\n#nw #s01 .fan-deck .card:hover,#nw #s01 .fan-deck:hover .card,#nw #s01 .fan-deck .card.picked{transform:none!important}\n#nw #s01 .fan-deck .card:nth-child(6){margin-left:18px!important;border-left:1px solid var(--line)!important;padding-left:28px!important}\n#nw #s01 .fan-deck .card:nth-child(n+6){display:block!important}\n@media(max-width:760px){#nw #s01 .fan-deck{transform:none!important;margin-top:24px!important}#nw #s01 .fan-deck .card{height:230px!important}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          # Add the three source cards after the five result cards; keep all in one row.
          needle='</div> <p class="fan-caption" id="fanCaption">'
          sources=''' <span class="s01-divider" aria-hidden="true"></span><button class="card pattern source-card" type="button"><img src="images/ai-photo/source/photo_2026-04-27_00-14-44.jpg" alt="Исходник 01"></button><button class="card pattern source-card" type="button"><img src="images/ai-photo/source/photo_2026-04-27_00-14-39.jpg" alt="Исходник 02"></button><button class="card pattern source-card" type="button"><img src="images/ai-photo/source/photo_2026-04-27_00-14-24.jpg" alt="Исходник 03"></button></div> <p class="fan-caption" id="fanCaption">'''
          s=s.replace(needle,sources,1)
          # Divider is a dedicated thin vertical element between result and source groups.
          css2='''\n#nw #s01 .s01-divider{flex:0 0 1px;height:270px;background:var(--line);margin:0 18px}\n#nw #s01 .fan-deck .source-card:nth-of-type(n){padding-left:0!important;margin-left:0!important;border-left:1px solid var(--line)!important}\n'''
          s=s.replace('</style>',css2+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm .github/workflows/s01-inline-source.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add works.html .github/workflows/s01-inline-source.yml
          git commit -m "Show photoshoot results and sources inline"
          git push