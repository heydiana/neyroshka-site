name: Promote approved OG v5

on:
  push:
    paths:
      - '.github/workflows/promote-og-v5.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy approved image and update metadata
        run: |
          set -euo pipefail
          cp images/neyroshka-header-preview-v4.jpg images/neyroshka-header-preview-v5.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('images/neyroshka-header-preview-v4.jpg','images/neyroshka-header-preview-v5.jpg')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit v5 preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/neyroshka-header-preview-v5.jpg
          git commit -m "Promote approved OG preview v5" || exit 0
          git push

# trigger approved v5
