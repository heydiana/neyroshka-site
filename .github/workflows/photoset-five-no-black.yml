name: Fix photoset framing and reload position
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photoset-five-no-black.yml']
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch works page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')

          # Keep the first large photo unchanged; move the four smaller photos down so faces are visible.
          css_marker='/* PHOTOSET FACE POSITION FIX 2026-08-14 */'
          css='''
/* PHOTOSET FACE POSITION FIX 2026-08-14 */
#nw #s01 .photoset-collage .tile:nth-child(n+2) img{object-position:center 10%!important}
'''
          if css_marker not in s:
              s=s.replace('</style>',css+'</style>',1)

          start='<script id="preserve-scroll-on-reload">'
          end='</script>'
          if start not in s:
              raise SystemExit('preserve-scroll-on-reload script not found')
          a=s.index(start)
          b=s.index(end,a)+len(end)
          replacement='''<script id="preserve-scroll-on-reload">
(function(){
  var key='neyroshka:works:scrollY';
  var savedHash=location.hash;
  try{history.scrollRestoration='manual';}catch(e){}

  /* Remove the fragment during initial load so the browser cannot jump to #s01-price on refresh. */
  if(savedHash){
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  }

  function save(){
    try{sessionStorage.setItem(key,String(window.scrollY||window.pageYOffset||0));}catch(e){}
  }

  function restore(){
    try{
      var y=sessionStorage.getItem(key);
      if(y===null)return;
      var target=parseFloat(y)||0;
      window.scrollTo(0,target);
      requestAnimationFrame(function(){window.scrollTo(0,target);});
      setTimeout(function(){
        window.scrollTo(0,target);
        if(savedHash){
          try{history.replaceState(null,'',location.pathname+location.search+savedHash);}catch(e){}
        }
      },80);
    }catch(e){}
  }

  window.addEventListener('pagehide',save);
  window.addEventListener('beforeunload',save);
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',restore,{once:true});
  }else{
    restore();
  }
  window.addEventListener('load',restore,{once:true});
  window.addEventListener('pageshow',restore);
})();
</script>'''
          s=s[:a]+replacement+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/photoset-five-no-black.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add works.html .github/workflows/photoset-five-no-black.yml
          git commit -m "Show photoset faces and preserve exact scroll on refresh"
          git push
