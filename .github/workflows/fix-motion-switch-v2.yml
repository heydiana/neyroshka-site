name: Fix motion switch v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-motion-switch-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch works.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('works.html')
          s = p.read_text(encoding='utf-8')
          old = "mainVideo.src=url;mainVideo.style.display='block';mainThumb.style.display='none';"
          new = "mainVideo.src=url;mainVideo.poster=itemImg?itemImg.src:'';mainVideo.load();mainVideo.style.display='block';mainThumb.style.display='none';const pp=mainVideo.play();if(pp&&pp.catch)pp.catch(()=>{});"
          if old not in s:
              raise SystemExit('target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          rm .github/workflows/fix-motion-switch-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works.html .github/workflows/fix-motion-switch-v2.yml
          git diff --cached --check
          git commit -m "Fix motion playlist switching"
          git push