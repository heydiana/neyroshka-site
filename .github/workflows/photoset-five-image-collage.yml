name: Apply five-image photoset collage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photoset-five-image-collage.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch works.html photoset only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')

          # Remove only the unwanted crouching photo from this photoset.
          s,n=re.subn(r'\s*<button class="tile" type="button"><img src="images/ai-photo/photoset/vidu-image-3333479222572912\.png"[^>]*><span class="label">ФОТОСЕТ — 04</span></button>', '', s, count=1)
          if n != 1:
              raise SystemExit('Target photoset image not found')

          css='''\n/* FINAL PHOTOSHOOT FIVE-IMAGE COLLAGE */\n#nw #s01 .photoset-collage{display:grid!important;grid-template-columns:1.12fr 1.28fr 1.28fr!important;grid-template-rows:310px 310px!important;gap:10px!important;overflow:visible!important;padding:4px 0!important;background:transparent!important}\n#nw #s01 .photoset-collage .tile{position:relative!important;display:block!important;width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important;background:transparent!important;border:1px solid var(--line)!important;transform:none!important}\n#nw #s01 .photoset-collage .tile:nth-child(1){grid-column:1!important;grid-row:1/3!important}\n#nw #s01 .photoset-collage .tile:nth-child(2){grid-column:2!important;grid-row:1!important}\n#nw #s01 .photoset-collage .tile:nth-child(3){grid-column:3!important;grid-row:1!important}\n#nw #s01 .photoset-collage .tile:nth-child(4){grid-column:2!important;grid-row:2!important}\n#nw #s01 .photoset-collage .tile:nth-child(5){grid-column:3!important;grid-row:2!important}\n#nw #s01 .photoset-collage .tile img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center center!important;transform:none!important;background:transparent!important}\n#nw #s01 .photoset-collage .tile:hover img{transform:none!important}\n#nw #s01 .photoset-collage .tile:after,#nw #s01 .photoset-collage .tile .label{display:none!important;content:none!important}\n@media(max-width:760px){#nw #s01 .photoset-collage{grid-template-columns:1fr 1fr!important;grid-template-rows:repeat(3,240px)!important}#nw #s01 .photoset-collage .tile:nth-child(n){grid-column:auto!important;grid-row:auto!important}}\n'''
          if '/* FINAL PHOTOSHOOT FIVE-IMAGE COLLAGE */' not in s:
              s=s.replace('</style>', css+'</style>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/photoset-five-image-collage.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add works.html .github/workflows/photoset-five-image-collage.yml
          git commit -m "Apply five-image photoset collage layout"
          git push