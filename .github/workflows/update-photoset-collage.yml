name: Update photoset collage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-photoset-collage.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch works page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')

          old='<div class="subblock"> <span class="sub">ФОТОСЕТ В ЕДИНОМ СТИЛЕ</span> <div class="rail rail-blue">'
          new='<div class="subblock photoset-collage-block"> <span class="sub">ФОТОСЕТ В ЕДИНОМ СТИЛЕ</span> <div class="rail rail-blue photoset-collage">'
          if old not in s:
              raise SystemExit('Photoset block marker not found')
          s=s.replace(old,new,1)

          # Correct the marked bouquet photo in the result collage: move the crop the opposite way,
          # but only slightly, so the face is fully visible and there is still some air above the head.
          s=s.replace('object-position:50% 0%!important','object-position:50% 32%!important',1)

          css='''\n/* PHOTOSHOOT: six-photo collage instead of horizontal rail */\n#nw #s01 .photoset-collage{display:grid!important;grid-template-columns:1.25fr 1fr 1fr 1.25fr;grid-template-rows:repeat(2,190px);gap:10px;overflow:visible!important;scroll-snap-type:none!important;padding:4px 0!important;cursor:default!important}\n#nw #s01 .photoset-collage .tile{position:relative;display:block;min-width:0!important;width:auto!important;height:auto!important;min-height:0!important;margin:0!important;transform:none!important;scroll-snap-align:none!important;overflow:hidden}\n#nw #s01 .photoset-collage .tile:nth-child(1){grid-column:1;grid-row:1/3}\n#nw #s01 .photoset-collage .tile:nth-child(2){grid-column:2/4;grid-row:1}\n#nw #s01 .photoset-collage .tile:nth-child(3){grid-column:2;grid-row:2}\n#nw #s01 .photoset-collage .tile:nth-child(4){grid-column:3;grid-row:2}\n#nw #s01 .photoset-collage .tile:nth-child(5){grid-column:4;grid-row:1}\n#nw #s01 .photoset-collage .tile:nth-child(6){grid-column:4;grid-row:2}\n#nw #s01 .photoset-collage .tile img{width:100%!important;height:100%!important;object-fit:cover!important}\n#nw #s01 .photoset-collage-block>.fan-hint{display:none!important}\n@media(max-width:760px){#nw #s01 .photoset-collage{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,180px)}#nw #s01 .photoset-collage .tile:nth-child(n){grid-column:auto;grid-row:auto}}\n'''
          if css.strip() not in s:
              s=s.replace('</style>',css+'</style>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/update-photoset-collage.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add works.html .github/workflows/update-photoset-collage.yml
          git commit -m "Convert photoset rail to collage and adjust portrait crop"
          git push