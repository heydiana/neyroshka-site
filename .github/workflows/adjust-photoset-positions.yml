name: Adjust photoset positions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/adjust-photoset-positions.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch works.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')
          marker='/* PHOTOSET INDIVIDUAL POSITION FIX 2026-08-14 */'
          css='''\n/* PHOTOSET INDIVIDUAL POSITION FIX 2026-08-14 */\n#nw #s01 .photoset-collage .tile:nth-child(3) img{object-position:center 0%!important}\n#nw #s01 .photoset-collage .tile:nth-child(4) img{object-position:center 5%!important}\n#nw #s01 .photoset-collage .tile:nth-child(5) img{object-position:center 5%!important}\n'''
          if marker not in s:
              s=s.replace('</style>',css+'</style>',1)
          else:
              start=s.index(marker)
              end=s.index('</style>',start)
              before=s[:start]
              after=s[end:]
              s=before+css+after
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/adjust-photoset-positions.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add works.html .github/workflows/adjust-photoset-positions.yml
          git commit -m "Adjust photoset image positions"
          git push
