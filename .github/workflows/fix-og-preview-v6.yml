name: Fix OG preview v6

on:
  push:
    paths:
      - '.github/workflows/fix-og-preview-v6.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build preview without cropping
        shell: bash
        run: |
          set -euo pipefail
          SRC="images/neyroshka-header-preview-v2.jpg"
          OUT="images/neyroshka-header-preview-v6.jpg"
          convert "$SRC" -resize '1200x630!' -quality 94 "$OUT"
          echo "OUTPUT=$(identify -format '%wx%h' "$OUT")"

      - name: Point metadata to v6
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          for old in [
              'images/neyroshka-header-preview-v2.jpg',
              'images/neyroshka-header-preview-v3.jpg',
              'images/neyroshka-header-preview-v4.jpg',
              'images/neyroshka-header-preview-v5.jpg',
          ]:
              s = s.replace(old, 'images/neyroshka-header-preview-v6.jpg')
          s = s.replace('<meta property="og:image:width" content="1185">','<meta property="og:image:width" content="1200">')
          s = s.replace('<meta property="og:image:height" content="622">','<meta property="og:image:height" content="630">')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit corrected preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/neyroshka-header-preview-v6.jpg
          git commit -m "Fix OG preview without crop" || exit 0
          git push
