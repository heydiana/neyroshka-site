name: Fix photoset crop and lightbox
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-photoset-crop-lightbox.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch photoset and lightbox
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')

          css='''\n/* photoset: keep faces visible in the collage */\n#nw #s01 .photoset-collage .tile img{object-position:50% 18%!important}\n'''
          if '/* photoset: keep faces visible in the collage */' not in s:
              s=s.replace('</style>',css+'</style>',1)

          js='''\n<script id="photoset-lightbox-fix">\ndocument.addEventListener('DOMContentLoaded',function(){\n  var box=document.getElementById('s01-lightbox');\n  if(!box)return;\n  var full=box.querySelector('img');\n  function closeBox(){\n    box.classList.remove('open');\n    box.setAttribute('aria-hidden','true');\n    if(full)full.removeAttribute('src');\n  }\n  /* close by tapping/clicking anywhere on the overlay, including the enlarged photo */\n  box.addEventListener('click',function(){closeBox();});\n  /* make the six-photo collage open in the same fullscreen viewer */\n  document.querySelectorAll('#s01 .photoset-collage .tile img').forEach(function(img){\n    img.parentElement.addEventListener('click',function(e){\n      e.preventDefault();\n      e.stopPropagation();\n      full.src=img.src;\n      full.alt=img.alt||'';\n      box.classList.add('open');\n      box.setAttribute('aria-hidden','false');\n    });\n  });\n  /* keep keyboard close as well */\n  document.addEventListener('keydown',function(e){\n    if((e.key==='Tab'||e.key==='Escape')&&box.classList.contains('open')){\n      e.preventDefault();\n      closeBox();\n    }\n  });\n});\n</script>\n'''
          if 'id="photoset-lightbox-fix"' not in s:
              s=s.replace('</body>',js+'</body>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/fix-photoset-crop-lightbox.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add works.html .github/workflows/fix-photoset-crop-lightbox.yml
          git commit -m "Show photoset faces and improve lightbox closing"
          git push