name: Add story video once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-story-video-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add story video only
        shell: python
        run: |
          from pathlib import Path
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')
          video='https://res.cloudinary.com/on8gjsd6/video/upload/v1787138027/%D0%BE%D0%BA%D0%BE%D0%BD%D1%87%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D0%B5_y4h7cr.mp4'
          poster='https://res.cloudinary.com/on8gjsd6/video/upload/v1787138027/%D0%BE%D0%BA%D0%BE%D0%BD%D1%87%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D0%B5_y4h7cr.jpg'
          start=s.index('<section class="section" id="s04">')
          end=s.index('<div class="subblock price-block" id="s04-price">',start)
          before,block,after=s[:start],s[start:end],s[end:]
          assert video not in block
          anchor='<div class="filmstrip" id="filmstrip"> '
          assert anchor in block
          item=('<button class="film-item" type="button" data-video="'+video+'"> '
                '<span class="film-thumb"><img src="'+poster+'" alt=""><span class="film-play">▶</span></span> '
                '<span class="film-meta"><strong>СЮЖЕТНОЕ ВИДЕО — 01</strong><small>0:18</small></span> '
                '</button> ')
          block=block.replace(anchor,anchor+item,1)
          s=before+block+after
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          rm .github/workflows/add-story-video-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works.html .github/workflows/add-story-video-once.yml
          git diff --cached --check
          git commit -m "Add story video to motion showcase"
          git push