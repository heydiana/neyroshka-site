name: Fix OG preview v4

on:
  push:
    paths:
      - '.github/workflows/fix-og-preview-v4.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ImageMagick
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Build safe OG crop
        shell: bash
        run: |
          set -euo pipefail
          SRC="images/neyroshka-header-preview-v2.jpg"
          OUT="images/neyroshka-header-preview-v4.jpg"
          IM="convert"
          if command -v magick >/dev/null 2>&1; then IM="magick"; fi

          SRC_W=$($IM identify -format '%w' "$SRC" 2>/dev/null || identify -format '%w' "$SRC")
          SRC_H=$($IM identify -format '%h' "$SRC" 2>/dev/null || identify -format '%h' "$SRC")
          GEOM=$($IM "$SRC" -fuzz 6% -trim -format '%@' info:)
          echo "SOURCE=${SRC_W}x${SRC_H} TRIM=${GEOM}"

          python - "$SRC_W" "$SRC_H" "$GEOM" > /tmp/crop.txt <<'PY'
          import re, sys
          sw, sh = map(int, sys.argv[1:3])
          m = re.fullmatch(r'(\d+)x(\d+)\+(-?\d+)\+(-?\d+)', sys.argv[3])
          if not m:
              raise SystemExit(f'Bad trim geometry: {sys.argv[3]}')
          w, h, x, y = map(int, m.groups())
          pad_x, pad_y = 44, 28
          left = max(0, x - pad_x)
          top = max(0, y - pad_y)
          right = min(sw, x + w + pad_x)
          bottom = min(sh, y + h + pad_y)
          target = 1200 / 630
          cw, ch = right - left, bottom - top
          current = cw / ch
          if current < target:
              need_w = min(sw, round(ch * target))
              extra = need_w - cw
              left -= extra // 2
              right += extra - extra // 2
          else:
              need_h = min(sh, round(cw / target))
              extra = need_h - ch
              top -= extra // 2
              bottom += extra - extra // 2
          if left < 0:
              right = min(sw, right - left)
              left = 0
          if right > sw:
              left = max(0, left - (right - sw))
              right = sw
          if top < 0:
              bottom = min(sh, bottom - top)
              top = 0
          if bottom > sh:
              top = max(0, top - (bottom - sh))
              bottom = sh
          cw, ch = right - left, bottom - top
          print(f'{cw}x{ch}+{left}+{top}')
          PY

          CROP=$(cat /tmp/crop.txt)
          echo "CROP=$CROP"
          $IM "$SRC" -crop "$CROP" +repage -resize '1200x630!' -quality 92 "$OUT"
          echo "OUTPUT=$($IM identify -format '%wx%h' "$OUT" 2>/dev/null || identify -format '%wx%h' "$OUT")"

      - name: Point metadata to OG v4
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('images/neyroshka-header-preview-v3.jpg','images/neyroshka-header-preview-v4.jpg')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixed preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/neyroshka-header-preview-v4.jpg
          git commit -m "Fix OG preview safe crop" || exit 0
          git push

# trigger
