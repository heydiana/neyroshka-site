name: Replace Tilda image references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-tilda-image-refs.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Tilda URLs with matching local images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          image_exts = {'.png','.jpg','.jpeg','.webp','.gif','.svg'}
          local_files = []
          for p in Path('.').rglob('*'):
              if p.is_file() and p.suffix.lower() in image_exts and '.git' not in p.parts:
                  local_files.append(p)

          def find_match(remote_name):
              remote = Path(remote_name)
              stem = remote.stem
              ext = remote.suffix.lower()
              matches = []
              for p in local_files:
                  if p.suffix.lower() != ext:
                      continue
                  if p.stem == stem or p.stem.startswith(stem):
                      matches.append(p)
              # Prefer files already organized under images/
              matches.sort(key=lambda p: (0 if p.parts and p.parts[0] == 'images' else 1, len(str(p))))
              if not matches:
                  return None
              # Only accept an unambiguous best prefix match.
              best_len = len(matches[0].stem)
              best = [p for p in matches if len(p.stem) == best_len]
              if len(best) > 1:
                  return None
              return matches[0]

          url_re = re.compile(r'https://static\.tildacdn\.(?:ink|com)/[^\"\'\s<>]+/([^/\"\'\s<>?#]+)')

          total = 0
          for html_name in ('index.html','works.html'):
              path = Path(html_name)
              text = path.read_text(encoding='utf-8')
              replacements = []

              def repl(m):
                  nonlocal_dummy = None
                  remote_name = m.group(1)
                  local = find_match(remote_name)
                  if not local:
                      return m.group(0)
                  replacements.append((m.group(0), local.as_posix()))
                  return local.as_posix()

              new_text = url_re.sub(repl, text)
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  total += len(replacements)
                  print(f'{html_name}: replaced {len(replacements)} Tilda image URL(s)')
                  for old, new in replacements:
                      print('  ', old, '->', new)
              else:
                  print(f'{html_name}: no matching Tilda image URLs found')

          print('TOTAL_REPLACED=', total)
          PY

      - name: Commit cleanup and remove temporary workflow
        run: |
          rm .github/workflows/replace-tilda-image-refs.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add index.html works.html .github/workflows/replace-tilda-image-refs.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Replace matching Tilda image URLs with local files"
          git push
