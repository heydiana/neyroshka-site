name: Fix s01 two collages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-s01-two-collages.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable file and rebuild only s01 lead gallery
        run: |
          git show ace090217c947366d20fc69952cafea9a00402aa:works.html > works.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')
          css='''\n/* s01 — two collages side by side */\n#nw #s01 .fan-tabs,#nw #s01 .fan-caption,#nw #s01 .fan-hint{display:none!important}\n#nw #s01 .s01-split{display:grid;grid-template-columns:minmax(0,5fr) 1px minmax(0,3fr);gap:26px;align-items:center;margin:34px 0 10px}\n#nw #s01 .s01-divider{width:1px;height:320px;background:var(--line)}\n#nw #s01 .s01-collage{display:grid;gap:10px;height:320px}\n#nw #s01 .s01-result{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr)}\n#nw #s01 .s01-source{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}\n#nw #s01 .s01-card{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface);padding:0;cursor:pointer;min-width:0}\n#nw #s01 .s01-card img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s}\n#nw #s01 .s01-card:hover img{transform:scale(1.03)}\n#nw #s01 .s01-result .s01-card:nth-child(1){grid-column:1/3;grid-row:1/3}\n#nw #s01 .s01-result .s01-card:nth-child(2){grid-column:3/5;grid-row:1/2}\n#nw #s01 .s01-result .s01-card:nth-child(3){grid-column:5/7;grid-row:1/3}\n#nw #s01 .s01-result .s01-card:nth-child(4){grid-column:3/4;grid-row:2/3}\n#nw #s01 .s01-result .s01-card:nth-child(5){grid-column:4/5;grid-row:2/3}\n#nw #s01 .s01-source .s01-card:nth-child(1){grid-column:1/2;grid-row:1/3}\n#nw #s01 .s01-source .s01-card:nth-child(2){grid-column:2/3;grid-row:1/2}\n#nw #s01 .s01-source .s01-card:nth-child(3){grid-column:2/3;grid-row:2/3}\n@media(max-width:900px){#nw #s01 .s01-split{grid-template-columns:1fr;gap:18px}#nw #s01 .s01-divider{width:100%;height:1px}#nw #s01 .s01-collage{height:300px}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          new='''<section class="section fan-section" id="s01"><div class="w"> <div class="head fan-title"><div><button type="button" class="num copy-link" data-target="s01">01 / PHOTOSHOOTS</button><h2>AI-фотосессии</h2></div><p class="copy">Все фотосессии: личный образ, fashion-серия или тёмная драматичная история. Выбираем настроение и собираем его в цельный визуал.</p></div> <span class="sub">ИЗ ИСХОДНИКОВ В КАДРЫ</span> <div class="s01-split"> <div class="s01-collage s01-result"> <button class="s01-card" type="button"><img src="images/ai-photo/result/f00bdb86-a459-4370-89db-e10119255be1.png" alt="Результат 01"></button> <button class="s01-card" type="button"><img src="images/ai-photo/result/c31164b0-81f3-42ac-8de9-b639ea5baf82.png" alt="Результат 02"></button> <button class="s01-card" type="button"><img src="images/ai-photo/result/bec5e3fd-6d89-4197-970e-e4ba0bbaad08.png" alt="Результат 03"></button> <button class="s01-card" type="button"><img src="images/ai-photo/result/6c0ce960-033d-47a2-ada8-1a730858d528.png" alt="Результат 04"></button> <button class="s01-card" type="button"><img src="images/ai-photo/result/325dd2bf-885d-445a-88d5-8321314afc06.png" alt="Результат 05"></button> </div> <div class="s01-divider" aria-hidden="true"></div> <div class="s01-collage s01-source"> <button class="s01-card" type="button"><img src="images/ai-photo/source/photo_2026-04-27_00-14-44.jpg" alt="Исходник 01"></button> <button class="s01-card" type="button"><img src="images/ai-photo/source/photo_2026-04-27_00-14-39.jpg" alt="Исходник 02"></button> <button class="s01-card" type="button"><img src="images/ai-photo/source/photo_2026-04-27_00-14-24.jpg" alt="Исходник 03"></button> </div> </div> <div class="subblock">'''
          pattern=r'<section class="section fan-section" id="s01"><div class="w">.*?<div class="subblock">'
          s2,n=re.subn(pattern,new,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f's01 replacement count={n}')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm .github/workflows/fix-s01-two-collages.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add works.html .github/workflows/fix-s01-two-collages.yml
          git commit -m "Show result and source collages side by side"
          git push