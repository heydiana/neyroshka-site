name: Restore Metrica consent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-metrica-consent.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore consent-gated Yandex Metrica
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_privacy = '''<p>В этой версии сайта не подключены Яндекс Метрика, Вебвизор, рекламные пиксели и другие системы веб-аналитики. Сайт не устанавливает аналитические или рекламные cookie и не сохраняет выбор согласия на аналитику.</p>'''
          new_privacy = '''<p>На сайте используется Яндекс Метрика. Аналитика загружается только после вашего согласия в плашке на сайте. До согласия код Метрики не запускается. Выбор сохраняется в localStorage браузера, чтобы не спрашивать повторно при каждом открытии сайта.</p>'''

          old_technical = '''Отсутствие аналитики не означает отсутствия технических запросов, необходимых для отображения сайта.'''
          new_technical = '''Эти технические запросы выполняются независимо от выбора аналитики и необходимы для отображения сайта.'''

          if old_privacy not in text:
              raise RuntimeError('Expected privacy analytics paragraph was not found')
          text = text.replace(old_privacy, new_privacy, 1)

          if old_technical not in text:
              raise RuntimeError('Expected technical-request sentence was not found')
          text = text.replace(old_technical, new_technical, 1)

          consent_block = r'''
<style id="ny-metrica-consent-style">
#nyMetricaConsent{position:fixed;left:16px;right:16px;bottom:16px;z-index:99998;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:#0D1119;border:1px solid rgba(242,245,249,.16);border-radius:14px;padding:14px 18px;color:#d7dde6;box-shadow:0 18px 42px rgba(0,0,0,.5);font:400 13px/1.5 Arial,sans-serif}
#nyMetricaConsent span{max-width:760px}
#nyMetricaConsent a{color:#A8C6E8}
#nyMetricaConsent .ny-consent-actions{display:flex;gap:8px;flex-wrap:wrap}
#nyMetricaConsent button{border:1px solid rgba(168,198,232,.45);border-radius:999px;padding:9px 16px;cursor:pointer;font:600 12px/1.2 Arial,sans-serif}
#nyMetricaConsent [data-consent="accept"]{background:#A8C6E8;color:#080A0F}
#nyMetricaConsent [data-consent="reject"]{background:transparent;color:#F2F5F9}
@media(max-width:640px){#nyMetricaConsent{left:10px;right:10px;bottom:10px;justify-content:flex-start;padding:12px 14px}#nyMetricaConsent .ny-consent-actions{width:100%}#nyMetricaConsent button{flex:1 1 auto}}
</style>
<script id="ny-metrica-consent">
(function(){
  var COUNTER_ID=111639709;
  var KEY='ny-metrica-consent-v1';

  function loadMetrica(){
    if(window.__nyMetricaLoaded)return;
    window.__nyMetricaLoaded=true;
    (function(m,e,t,r,i,k,a){
      m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
      m[i].l=1*new Date();
      for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r)return;}
      k=e.createElement(t);a=e.getElementsByTagName(t)[0];k.async=1;k.src=r;a.parentNode.insertBefore(k,a);
    })(window,document,'script','https://mc.yandex.ru/metrika/tag.js?id='+COUNTER_ID,'ym');
    ym(COUNTER_ID,'init',{ssr:true,webvisor:true,clickmap:true,ecommerce:'dataLayer',accurateTrackBounce:true,trackLinks:true});
  }

  function readChoice(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function saveChoice(value){try{localStorage.setItem(KEY,value)}catch(e){}}

  function showConsent(){
    if(document.getElementById('nyMetricaConsent'))return;
    var box=document.createElement('div');
    box.id='nyMetricaConsent';
    box.setAttribute('role','dialog');
    box.setAttribute('aria-label','Настройки аналитики');
    box.innerHTML='<span>Сайт использует Яндекс Метрику для обезличенной аналитики. Метрика запустится только после вашего согласия. <a href="#privacy">Подробнее</a>.</span><div class="ny-consent-actions"><button type="button" data-consent="reject">Только необходимые</button><button type="button" data-consent="accept">Разрешить аналитику</button></div>';
    document.body.appendChild(box);
    box.querySelector('[data-consent="accept"]').addEventListener('click',function(){saveChoice('accepted');box.remove();loadMetrica();});
    box.querySelector('[data-consent="reject"]').addEventListener('click',function(){saveChoice('rejected');box.remove();});
  }

  function init(){
    var choice=readChoice();
    if(choice==='accepted'){loadMetrica();return;}
    if(choice==='rejected')return;
    showConsent();
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
'''

          if 'id="ny-metrica-consent"' not in text:
              if '</body>' not in text:
                  raise RuntimeError('Closing body tag was not found')
              text = text.replace('</body>', consent_block + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore consent-gated Yandex Metrica"
          git push
