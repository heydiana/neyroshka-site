name: Fix consent choice persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-metrica-consent.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix localStorage persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'function saveChoice(value){try{localStorage.getItem(KEY,value)}catch(e){}}'
          new = 'function saveChoice(value){try{localStorage.setItem(KEY,value)}catch(e){}}'
          if old not in s:
              raise RuntimeError('Expected consent persistence code was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix consent choice persistence"
          git push
