name: Fix s01 photo position
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-s01-result05-position.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust only the marked photo position
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')
          css='''\n/* s01: show the face in the marked bouquet photo */\n#nw #s01 .s01-result .s01-card img[src="images/ai-photo/result/325dd2bf-885d-445a-88d5-8321314afc06.png"]{object-position:50% 15%!important}\n'''
          if css.strip() not in s:
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm .github/workflows/fix-s01-result05-position.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add works.html .github/workflows/fix-s01-result05-position.yml
          git commit -m "Adjust bouquet photo position in AI photoshoots"
          git push