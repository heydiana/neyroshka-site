name: Preserve scroll position on reload
on:
  push:
    branches: [main]
    paths: ['.github/workflows/preserve-scroll.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch works page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')
          js='''\n<script id="preserve-scroll-on-reload">\n(function(){\n  var key='neyroshka:works:scrollY';\n  try{history.scrollRestoration='manual';}catch(e){}\n  function save(){try{sessionStorage.setItem(key,String(window.scrollY||window.pageYOffset||0));}catch(e){}}\n  window.addEventListener('pagehide',save);\n  window.addEventListener('beforeunload',save);\n  window.addEventListener('pageshow',function(){\n    try{\n      var y=sessionStorage.getItem(key);\n      if(y!==null){\n        requestAnimationFrame(function(){requestAnimationFrame(function(){window.scrollTo(0,parseFloat(y)||0);});});\n      }\n    }catch(e){}\n  });\n})();\n</script>\n'''
          if 'id="preserve-scroll-on-reload"' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/preserve-scroll.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add works.html .github/workflows/preserve-scroll.yml
          git commit -m "Preserve exact scroll position on reload"
          git push