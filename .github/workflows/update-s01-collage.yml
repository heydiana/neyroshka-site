name: Update s01 collage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-s01-collage.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update s01
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')
          # Keep result/source separation, but show each mode as a clean collage.
          css='''\n/* s01 collage — result/source remain separate */\n#nw #s01 .fan-deck{height:430px;max-width:760px;margin:34px auto 0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:10px}\n#nw #s01 .fan-deck .card{position:relative;inset:auto;left:auto;top:auto;margin:0;width:auto;height:auto;transform:none!important;box-shadow:none}\n#nw #s01 .fan-deck .card:nth-child(1){grid-column:1/3;grid-row:1/3}\n#nw #s01 .fan-deck .card:nth-child(2){grid-column:3/5;grid-row:1/2}\n#nw #s01 .fan-deck .card:nth-child(3){grid-column:5/7;grid-row:1/3}\n#nw #s01 .fan-deck .card:nth-child(4){grid-column:3/4;grid-row:2/3}\n#nw #s01 .fan-deck .card:nth-child(5){grid-column:4/5;grid-row:2/3}\n#nw #s01 .fan-deck:hover .card{transform:none!important}\n#nw #s01 .fan-deck .card.picked{transform:none!important;z-index:6!important;outline:1px solid var(--blue)}\n#nw #s01 .fan-caption{margin-top:18px}\n@media(max-width:760px){#nw #s01 .fan-deck{height:360px;max-width:100%;transform:none;margin:28px auto 0;gap:6px}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          # Requested title.
          s=s.replace('<h2>ТВОЯ<br>ЭРА</h2>','<h2>AI-фотосессии</h2>')
          s=s.replace('<h2>ТВОЯ ЭРА</h2>','<h2>AI-фотосессии</h2>')
          # Remove only the instruction line in s01.
          s=s.replace('<p class="fan-hint">КЛИК ПО КАРТОЧКЕ → ВПЕРЁД / ЕЩЁ РАЗ → НА ВЕСЬ ЭКРАН / КЛИК РЯДОМ → ЗАКРЫТЬ</p>','')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm .github/workflows/update-s01-collage.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add works.html .github/workflows/update-s01-collage.yml
          git commit -m "Update AI photoshoots section collage"
          git push