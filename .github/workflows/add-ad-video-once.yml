name: Add new ad video once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-ad-video-once.yml'

permissions:
  contents: write

jobs:
  patch-works:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch works video showcase
        shell: python
        run: |
          from pathlib import Path

          path = Path('works.html')
          text = path.read_text(encoding='utf-8')

          video = 'https://res.cloudinary.com/on8gjsd6/video/upload/v1787136848/%D1%81_%D1%81%D0%B0%D0%B1%D0%B0%D0%BC%D0%B8_ezqqg6.mp4'
          poster = 'https://res.cloudinary.com/on8gjsd6/video/upload/v1787136848/%D1%81_%D1%81%D0%B0%D0%B1%D0%B0%D0%BC%D0%B8_ezqqg6.jpg'

          old_main_thumb = 'https://res.cloudinary.com/on8gjsd6/video/upload/v1785926493/0720_one_word_subtitles_EDITED_crxbo5.jpg'
          old_main_video = 'https://res.cloudinary.com/on8gjsd6/video/upload/v1785926493/0720_one_word_subtitles_EDITED_crxbo5.mp4'

          # Only patch the 04 / MOTION showcase.
          start = text.index('<section class="section" id="s04">')
          end = text.index('<div class="subblock price-block" id="s04-price">', start)
          before, block, after = text[:start], text[start:end], text[end:]

          # Shift existing AD numbering before inserting the new item.
          assert block.count('РЕКЛАМА — 01') == 1
          assert block.count('РЕКЛАМА — 02') == 1
          block = block.replace('РЕКЛАМА — 02', 'РЕКЛАМА — 03', 1)
          block = block.replace('РЕКЛАМА — 01', 'РЕКЛАМА — 02', 1)

          # New video becomes the visible/active first video.
          assert block.count(old_main_thumb) >= 2
          assert block.count(old_main_video) >= 2
          block = block.replace(old_main_thumb, poster, 2)
          block = block.replace(old_main_video, video, 1)

          old_first = '<button class="film-item active" type="button" data-video="' + old_main_video + '">'
          assert old_first in block
          block = block.replace(old_first, '<button class="film-item" type="button" data-video="' + old_main_video + '">', 1)

          anchor = '<div class="filmstrip" id="filmstrip"> '
          assert anchor in block
          new_item = (
              '<button class="film-item active" type="button" data-video="' + video + '"> '
              '<span class="film-thumb"><img src="' + poster + '" alt=""><span class="film-play">▶</span></span> '
              '<span class="film-meta"><strong>РЕКЛАМА — 01</strong></span> '
              '</button> '
          )
          block = block.replace(anchor, anchor + new_item, 1)

          patched = before + block + after
          assert patched.count(video) == 2
          assert patched.count('РЕКЛАМА — 01') == 1
          assert patched.count('РЕКЛАМА — 02') == 1
          assert patched.count('РЕКЛАМА — 03') == 1
          path.write_text(patched, encoding='utf-8')

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/add-ad-video-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works.html .github/workflows/add-ad-video-once.yml
          git diff --cached --check
          git commit -m "Add new ad video to works showcase"
          git push
