name: Fix exact scroll restore v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-scroll-restore-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch works.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('works.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<script id="preserve-scroll-on-reload">')
          end=s.index('</script>',start)+len('</script>')
          new=r'''<script id="preserve-scroll-on-reload">
(function(){
  var key='neyroshka:works:scrollY';
  var pathKey='neyroshka:works:path';
  try{history.scrollRestoration='manual';}catch(e){}

  function pos(){return window.scrollY||window.pageYOffset||0}
  function jump(y){
    try{window.scrollTo({top:y,left:0,behavior:'auto'});}catch(e){window.scrollTo(0,y);}
  }
  function save(){
    try{
      sessionStorage.setItem(key,String(pos()));
      sessionStorage.setItem(pathKey,location.pathname+location.search);
    }catch(e){}
  }

  var navEntry=null;
  try{navEntry=performance.getEntriesByType('navigation')[0]||null;}catch(e){}
  var isReload=navEntry?navEntry.type==='reload':(performance.navigation&&performance.navigation.type===1);

  if(isReload){
    var samePage=false;
    var target=null;
    var savedHash=location.hash;
    try{
      samePage=sessionStorage.getItem(pathKey)===(location.pathname+location.search);
      var raw=sessionStorage.getItem(key);
      if(raw!==null)target=parseFloat(raw);
    }catch(e){}

    if(samePage&&Number.isFinite(target)){
      if(savedHash){
        try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
      }
      jump(target);
      requestAnimationFrame(function(){
        jump(target);
        if(savedHash){
          try{history.replaceState(null,'',location.pathname+location.search+savedHash);}catch(e){}
        }
      });
    }
  }

  var ticking=false;
  window.addEventListener('scroll',function(){
    if(ticking)return;
    ticking=true;
    requestAnimationFrame(function(){ticking=false;save()});
  },{passive:true});
  window.addEventListener('pagehide',save);
  window.addEventListener('beforeunload',save);
})();
</script>'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
      - name: Commit fix
        run: |
          rm .github/workflows/fix-scroll-restore-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works.html .github/workflows/fix-scroll-restore-v2.yml
          git diff --cached --check
          git commit -m "Keep exact scroll position after reload"
          git push