name: Match category arrows to price arrows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-category-arrows-like-prices.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update category arrows
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Match the exact visual direction used in the price cards.
          text = text.replace('<span class="ny-work-arrow">→</span>', '<span class="ny-work-arrow">↘</span>')

          # Make category arrows visually match the price arrows.
          pattern = r'#ny \.ny-works-grid--categories \.ny-work-arrow\{.*?\}'
          replacement = '#ny .ny-works-grid--categories .ny-work-arrow{position:absolute;z-index:2;right:24px;bottom:24px;color:var(--cream);font:600 60px/.72 Oswald,sans-serif;transition:transform .22s ease}'
          text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one category arrow CSS block, found {n}')

          # Same hover movement as price cards.
          if '#ny .ny-works-grid--categories .ny-work:hover .ny-work-arrow' not in text:
              text = text.replace(replacement, replacement + '#ny .ny-works-grid--categories .ny-work:hover .ny-work-arrow{transform:translate(6px,6px)}')

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and clean up workflow
        run: |
          rm .github/workflows/fix-category-arrows-like-prices.yml
          git config user.name "heydiana"
          git config user.email "70851747+heydiana@users.noreply.github.com"
          git add index.html .github/workflows/fix-category-arrows-like-prices.yml
          git commit -m "Match category arrows to price cards"
          git push